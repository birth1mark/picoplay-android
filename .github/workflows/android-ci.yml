name: PicoPlay Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Google Play AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download SDL2 2.30.8 Source
        run: |
          if [ ! -f android/app/jni/SDL2/CMakeLists.txt ]; then
            curl -sL https://github.com/libsdl-org/SDL/releases/download/release-2.30.8/SDL2-2.30.8.tar.gz -o /tmp/sdl2.tar.gz
            mkdir -p android/app/jni/SDL2
            tar -xzf /tmp/sdl2.tar.gz -C android/app/jni/SDL2 --strip-components=1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Full & PlayStore Releases (APK + AAB)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFullRelease assemblePlaystoreRelease bundlePlaystoreRelease --no-daemon

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: picoplay-android-releases
          path: |
            android/app/build/outputs/apk/full/release/*.apk
            android/app/build/outputs/apk/playstore/release/*.apk
            android/app/build/outputs/bundle/playstoreRelease/*.aab
